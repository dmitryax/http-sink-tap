apiVersion: v1
kind: Namespace
metadata:
  name: http-sink-tap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-sink-tap
  namespace: http-sink-tap
  labels:
    app.kubernetes.io/name: http-sink-tap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: http-sink-tap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-sink-tap
    spec:
      containers:
        - name: http-sink-tap
          image: registry.example.com/http-sink-tap:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: sink
              containerPort: 8080
            - name: listener
              containerPort: 8081
          env:
            - name: SINK_ADDR
              value: ":8080"
            - name: LISTENER_ADDR
              value: ":8081"
            - name: BODY_LIMIT_BYTES
              value: "1048576"
            - name: HISTORY_LIMIT
              value: "200"
          readinessProbe:
            httpGet:
              path: /healthz
              port: listener
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: listener
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: http-sink-tap
  namespace: http-sink-tap
  labels:
    app.kubernetes.io/name: http-sink-tap
spec:
  selector:
    app.kubernetes.io/name: http-sink-tap
  ports:
    - name: sink
      port: 8080
      targetPort: sink
    - name: listener
      port: 8081
      targetPort: listener
